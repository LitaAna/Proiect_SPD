x-api: &api
  build: .
  environment:
    MONGO_URL: mongodb://mongo:27017
    REDIS_URL: redis://redis:6379/0
    CACHE_TTL: "60"
  depends_on:
    mongo:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  api1:
    <<: *api
    ports:
      - "8001:8000"
  api2:
    <<: *api
    ports:
      - "8002:8000"
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - lab
  lab:
    <<: *api
    command: uvicorn app.lab:app --host 0.0.0.0 --port 8000

volumes:
  mongo_data:
