events {}
http {
    upstream backend {
        server api1:8000;
        server api2:8000;
    }
    server {
        listen 80;
        location /single/ {
            proxy_pass http://api1:8000/;
            proxy_set_header Host $host;
        }
        location /lab/ {
            proxy_pass http://lab:8000;
            proxy_set_header Host $host;
        }
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }
    }
}
